<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Weather App</h1>

  <form id="weather-form">
    <input type="text" id="location-input" placeholder="Enter a city..." required>
    <button type="submit">Get Weather</button>
  </form>

  <div id="weather-result" class="hidden">
    <h2 id="location-name"></h2>
    <p id="conditions"></p>
    <p><span id="temperature"></span> <button id="unit-toggle">Show °C</button></p>
    <p>Humidity: <span id="humidity"></span>%</p>
    <p>Wind Speed: <span id="wind-speed"></span> mph</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
